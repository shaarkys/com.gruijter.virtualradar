<!doctype html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script type="text/javascript" src="/manager/webserver/assets/js/jquery.js"></script>
    <script type="text/javascript" src="pair.js" data-origin="pair"></script>
</head>

<body>
    <div class="setting">
        <p data-i18n="pair.instructions" class="instructions">Instructions</p>

        <!-- Radar Selection -->
        <label class="settings-item-description" data-i18n="pair.radarSelection">Select radar type</label>
        <div class="settings-itemgroup">
            <select id="radarSelection" onchange="radarSelected()">
                <option value="openSky" data-i18n="pair.openSky" selected>openSky</option>
                <!-- <option value="adsbExchangeFeeder" data-i18n="pair.adsbExchangeFeeder">adsbExchangeFeeder</option> -->
                <option value="adsbExchangePaid" data-i18n="pair.adsbExchangePaid">adsbExchangePaid</option> 
                <!-- <option value="Generic" data-i18n="pair.genericMeter">Generic</option> -->
            </select>
        </div>

        <!-- OpenSky Credentials (Initially Hidden) -->
        <div id="credentialsContainer" style="display: none;">
            <label class="settings-item-description" data-i18n="pair.authMethod">Authentication</label>
            <div class="settings-itemgroup">
                <select id="authMethod" onchange="authMethodSelected()">
                    <option value="oauth2" data-i18n="pair.authMethodOAuth2" selected>API client (new accounts)</option>
                    <option value="basic" data-i18n="pair.authMethodBasic">Legacy username/password</option>
                </select>
            </div>
            <p class="settings-item-description" data-i18n="pair.authMethodHint">New OpenSky accounts (mid-March 2025 and later) must use an API client. Older accounts may still use username/password.</p>

            <div id="oauthFields">
                <label class="settings-item-description" data-i18n="pair.clientId">API client ID</label>
                <div class="settings-itemgroup">
                    <input id="clientId" type="text" value="">
                </div>

                <label class="settings-item-description" data-i18n="pair.clientSecret">API client secret</label>
                <div class="settings-itemgroup">
                    <input id="clientSecret" type="password" value="">
                </div>
            </div>

            <div id="basicFields">
            <label class="settings-item-description" data-i18n="pair.username">Username (optional)</label>
            <div class="settings-itemgroup">
                <input id="username" type="text" value="">
            </div>

            <label class="settings-item-description" data-i18n="pair.password">Password (optional)</label>
            <div class="settings-itemgroup">
                <input id="password" type="password" value="">
            </div>
            </div>

            <!-- Fallback to own data -->
            <label class="settings-item-description" data-i18n="pair.fallbackOwnData">Fallback to own data</label>
            <div class="settings-itemgroup">
                <input id="fallbackOwnData" type="checkbox" />
            </div>

            <!-- Feeder serial number -->
            <label class="settings-item-description" data-i18n="pair.feederSerial">Feeder Serial Number
                (optional)</label>
            <div class="settings-itemgroup">
                <input id="feederSerial" type="text" value="">
            </div>

        </div>
        
        <!-- API Key Field -->
        <label class="settings-item-description" id="APIKeyLabel" data-i18n="pair.APIKey">API key</label>
        <div class="settings-itemgroup">
            <input id="APIKey" type="text" value="">
        </div>

        <!-- Start Test Button -->
        <label class="settings-item-description" data-i18n="pair.testSettings">Start test</label>
        <button id="runTest" class="btn" onclick="testSettings()" data-i18n="pair.testSettings">Start Test</button>
    </div>
</body>

</html>
